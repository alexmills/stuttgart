<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Stuttgart</title>
        <link href="app.css" rel="stylesheet">
        <link href="bootstrap/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        
        <nav class="navbar bg-body-tertiary border-bottom mb-5" >
            <div class="container-fluid justify-content-center">
                <nav class="nav nav-pills" id="pills-tab" role="tablist">
                    <button class="nav-link active position-relative" id="pills-connect-tab" data-bs-toggle="pill" data-bs-target="#pills-connect" type="button" role="tab" aria-controls="pills-connect" aria-selected="true">
                        Device
                        <span id="x-connection-status-badge">
                            <span class="visually-hidden">Disconnected</span>
                        </span>
                    </button>
                    <button class="nav-link" id="pills-dashboard-tab" data-bs-toggle="pill" data-bs-target="#pills-dashboard" type="button" role="tab" aria-controls="pills-dashboard" aria-selected="false">Dashboard</button>
                    <button class="nav-link" id="pills-datalog-tab" data-bs-toggle="pill" data-bs-target="#pills-datalog" type="button" role="tab" aria-controls="pills-datalog" aria-selected="false">Datalog</button>
                </nav>
            </div>
        </nav>

        <!-- Connect Tab -->

        <div class="tab-content" id="pills-tabContent">
            <div class="tab-pane fade show active" id="pills-connect" role="tabpanel" aria-labelledby="pills-connect-tab" tabindex="0">
                <div class="container">

                    <div class="row mb-3">
                        <div class="col">
                            <h1 class="h4">Connect to device</h1>
                            <hr>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <button type="button" class="btn" id="x-connect-button">-</button>
                        </div>

                        <div class="col">
                            <div class="list-group">
                                <div class="list-group-item">
                                    <span class="fw-bold">Status:</span>
                                    <span id="x-connection-status" class="badge">--</span>
                                </div>
                                <div class="list-group-item">
                                    <span class="fw-bold">Temperature:</span>
                                    --
                                </div>
                                <div class="list-group-item">
                                    <span class="fw-bold">Uptime:</span>
                                    --
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!--  Dashboard Tab -->

            <div class="tab-pane fade" id="pills-dashboard" role="tabpanel" aria-labelledby="pills-dashboard-tab" tabindex="0">
                <div class="container">
                    <div class="row mb-3">
                        <div class="col">
                            <h1 class="h4">Dashboard</h1>
                            <hr>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Datalog Tab -->

            <div class="tab-pane fade" id="pills-datalog" role="tabpanel" aria-labelledby="pills-datalog-tab" tabindex="0">
                <div class="container">
                    <div class="row mb-3">
                        <div class="col">
                            <h1 class="h4">Datalog</h1>
                            <hr>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>

        <script type="module" src="app.js"></script>
        <script src="bootstrap/bootstrap.bundle.min.js"></script>
    </body>
</html>
